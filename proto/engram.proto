syntax = "proto3";

package engram.v1;

option go_package = "github.com/shrec21/engram/proto/engrampb";

import "google/protobuf/timestamp.proto";

// ── Data Model ──

message MemoryRecord {
  string namespace = 1;
  string key = 2;
  bytes value = 3;
  uint64 version = 4;
  string created_by = 5;
  string source = 6;
  float confidence = 7;
  google.protobuf.Timestamp created_at = 8;
  google.protobuf.Timestamp updated_at = 9;
  google.protobuf.Timestamp expires_at = 10;
  google.protobuf.Timestamp last_accessed_at = 11;
  uint64 access_count = 12;
  repeated float embedding = 13;        // float32 vector
  string embedding_model = 14;          // e.g. "nomic-embed-text"
  uint64 embedded_version = 15;         // version when embedding was computed
  bool pinned = 16;                     // exempt from decay eviction
}

// ── Consistency Levels ──

enum ConsistencyLevel {
  CONSISTENCY_SESSION = 0;       // default: wait for applied_index
  CONSISTENCY_LINEARIZABLE = 1;  // VerifyLeader + Barrier
  CONSISTENCY_STALE = 2;         // read local state immediately
}

// ── Deterministic Apply Interface ──
// Command is serialized into the Raft log.
// Timestamps are assigned BEFORE Apply and carried in the command.

message Command {
  google.protobuf.Timestamp timestamp = 1;
  string client_id = 5;  // for exactly-once dedup
  uint64 seq = 6;        // monotonic per client
  oneof payload {
    PutCommand put = 2;
    CompareAndSetCommand compare_and_set = 3;
    DeleteCommand delete = 4;
    TouchCommand touch = 7;  // batched access metadata
    SetEmbeddingCommand set_embedding = 8;
    SetDecayPolicyCommand set_decay_policy = 9;
  }
}

message PutCommand {
  string namespace = 1;
  string key = 2;
  bytes value = 3;
  string created_by = 4;
  string source = 5;
  float confidence = 6;
  google.protobuf.Timestamp expires_at = 7;
  bool pinned = 8;
}

message CompareAndSetCommand {
  string namespace = 1;
  string key = 2;
  bytes value = 3;
  uint64 expected_version = 4;
  string created_by = 5;
  string source = 6;
  float confidence = 7;
  google.protobuf.Timestamp expires_at = 8;
  bool pinned = 9;
}

message DeleteCommand {
  string namespace = 1;
  string key = 2;
  uint64 expected_version = 3; // 0 = unconditional
}

message TouchCommand {
  repeated TouchEntry entries = 1;
}

message TouchEntry {
  string namespace = 1;
  string key = 2;
  google.protobuf.Timestamp last_accessed_at = 3;
  uint64 access_count_delta = 4;
}

message SetEmbeddingCommand {
  string namespace = 1;
  string key = 2;
  uint64 expected_version = 3;
  repeated float embedding = 4;
  string embedding_model = 5;
}

message SetDecayPolicyCommand {
  string namespace = 1;
  DecayPolicy policy = 2;
}

message DecayPolicy {
  double half_life_seconds = 1;
  double access_weight = 2;
  double min_score = 3;
}

// Apply returns this. Not in the Raft log, just the response.
message CommandResult {
  oneof result {
    MutationResult mutation = 1;
    DeleteResult delete_result = 2;
    CASConflict cas_conflict = 3;
    TouchResult touch_result = 4;
    SetEmbeddingResult set_embedding_result = 5;
    SetDecayPolicyResult set_decay_policy_result = 6;
  }
}

message MutationResult {
  uint64 version = 1;
}

message DeleteResult {}

message CASConflict {
  uint64 current_version = 1;
}

message TouchResult {}

message SetEmbeddingResult {
  bool applied = 1;
}

message SetDecayPolicyResult {}

// ── gRPC Service ──

message PutRequest {
  string namespace = 1;
  string key = 2;
  bytes value = 3;
  string created_by = 4;
  string source = 5;
  float confidence = 6;
  google.protobuf.Timestamp expires_at = 7;
  string client_id = 8;
  uint64 seq = 9;
  bool pinned = 10;
}

message PutResponse {
  uint64 version = 1;
  uint64 applied_index = 2;
  uint32 shard_id = 3;
}

message GetRequest {
  string namespace = 1;
  string key = 2;
  ConsistencyLevel consistency = 3;
  uint64 applied_index = 4;  // client session token
}

message GetResponse {
  MemoryRecord record = 1;
  uint64 applied_index = 2;
  uint32 shard_id = 3;
}

message CompareAndSetRequest {
  string namespace = 1;
  string key = 2;
  bytes value = 3;
  uint64 expected_version = 4;
  string created_by = 5;
  string source = 6;
  float confidence = 7;
  google.protobuf.Timestamp expires_at = 8;
  string client_id = 9;
  uint64 seq = 10;
  bool pinned = 11;
}

message CompareAndSetResponse {
  uint64 version = 1;
  uint64 applied_index = 2;
  uint32 shard_id = 3;
}

message DeleteRequest {
  string namespace = 1;
  string key = 2;
  uint64 expected_version = 3;
  string client_id = 4;
  uint64 seq = 5;
}

message DeleteResponse {
  uint64 applied_index = 1;
  uint32 shard_id = 2;
}

message ListRequest {
  string namespace = 1;
  string key_prefix = 2;
  int32 limit = 3;
  string page_token = 4;
  ConsistencyLevel consistency = 5;
  uint64 applied_index = 6;
}

message ListResponse {
  repeated MemoryRecord records = 1;
  string next_page_token = 2;
  uint64 applied_index = 3;
  uint32 shard_id = 4;
}

// NOT_LEADER error detail for redirects.
message NotLeaderDetail {
  string leader_address = 1;  // gRPC address
  string leader_id = 2;
  uint32 shard_id = 3;
  uint64 shard_map_version = 4;
}

// WRONG_SHARD error detail: client sent request to a node that does not
// host this shard, or the namespace maps to a different shard.
message WrongShardDetail {
  uint32 shard_id = 1;              // correct shard for the namespace
  uint64 shard_map_version = 2;     // current shard map version
}

// ── Search ──

message SearchRequest {
  string namespace = 1;
  string query_text = 2;
  repeated float query_vector = 3;
  int32 k = 4;
  ConsistencyLevel consistency = 5;
  uint64 applied_index = 6;
  string key_prefix = 7;
  string created_by = 8;
  float min_confidence = 9;
  google.protobuf.Timestamp updated_after = 10;
  float similarity_weight = 11;  // alpha for sim vs decay blend, default 0.7
}

message SearchResult {
  MemoryRecord record = 1;
  float score = 2;
  float similarity = 3;
  float decay_score = 4;
  bool embedding_current = 5;
}

message SearchResponse {
  repeated SearchResult results = 1;
  uint64 applied_index = 2;
  uint32 shard_id = 3;
}

service MemoryService {
  rpc Put(PutRequest) returns (PutResponse);
  rpc Get(GetRequest) returns (GetResponse);
  rpc CompareAndSet(CompareAndSetRequest) returns (CompareAndSetResponse);
  rpc Delete(DeleteRequest) returns (DeleteResponse);
  rpc List(ListRequest) returns (ListResponse);
  rpc Search(SearchRequest) returns (SearchResponse);
}

// ── Admin Service ──

service AdminService {
  rpc AddVoter(AddVoterRequest) returns (AddVoterResponse);
  rpc RemoveServer(RemoveServerRequest) returns (RemoveServerResponse);
  rpc GetClusterStatus(GetClusterStatusRequest) returns (GetClusterStatusResponse);
  rpc SetDecayPolicy(SetDecayPolicyRequest) returns (SetDecayPolicyResponse);
  rpc GetDecayPolicy(GetDecayPolicyRequest) returns (GetDecayPolicyResponse);
}

message AddVoterRequest {
  string server_id = 1;
  string address = 2;  // Raft transport address
}

message AddVoterResponse {}

message RemoveServerRequest {
  string server_id = 1;
}

message RemoveServerResponse {}

message GetClusterStatusRequest {}

message GetClusterStatusResponse {
  string leader_id = 1;
  string leader_address = 2;
  uint64 term = 3;
  uint64 applied_index = 4;
  uint64 commit_index = 5;
  repeated ServerInfo servers = 6;
}

message ServerInfo {
  string id = 1;
  string address = 2;
  string suffrage = 3;
}

message SetDecayPolicyRequest {
  string namespace = 1;
  DecayPolicy policy = 2;
  string client_id = 3;
  uint64 seq = 4;
}

message SetDecayPolicyResponse {
  uint64 applied_index = 1;
}

message GetDecayPolicyRequest {
  string namespace = 1;
}

message GetDecayPolicyResponse {
  DecayPolicy policy = 1;
}
